name: batterie
# Gene - Oct, 09, 2026: Replaced template description with the real app description.
# description: "A new Flutter project."
description: "A lightweight battery alarm desktop app for macOS and Windows."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Gene - Oct, 07, 2026: Bump version to 1.0.1+2 for release
# version: 1.0.0+1
version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  battery_plus: ^7.1.1
  audioplayers: ^6.8.1
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  shared_preferences: ^2.5.5
  file_picker: ^12.2.0
  # Gene - Oct, 07, 2026: Added path_provider to persist custom alarm sounds inside App Sandbox container
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Gene - Oct, 09, 2026: Added msix to package the Windows build for Microsoft Store submission (Store-signed, no SmartScreen warning).
  msix: ^3.18.0

flutter:

  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Gene - Oct, 09, 2026: MSIX packaging config for Microsoft Store submission.
# Build on Windows with: dart run msix:create --store
# Replace identity_name, publisher and publisher_display_name with the exact values from
# Partner Center > Apps and games > Batterie > Product identity (after reserving the app name).
msix_config:
  display_name: Batterie
  # Gene - Oct, 09, 2026: Set Microsoft Store Partner Center identity credentials.
  # publisher_display_name: REPLACE-WITH-PARTNER-CENTER-PUBLISHER-DISPLAY-NAME
  # identity_name: 00000Publisher.Batterie
  # publisher: CN=00000000-0000-0000-0000-000000000000
  publisher_display_name: genexis.dev
  identity_name: genexis.dev.Batterie
  publisher: CN=1DFE82D6-D264-4FA7-BD15-F2DFAE3C949D
  # msix_version is derived from pubspec `version` (e.g. 1.0.1+2 -> 1.0.1.0; Store requires last segment 0).
  description: A lightweight battery alarm desktop app for macOS and Windows.
  logo_path: assets/icons/app_logo.png
  languages: en-us
  architecture: x64
  store: true
