name: Release (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      # Gene - Oct, 07, 2026: Enhanced macOS release workflow with Apple Developer ID signing, Hardened Runtime, DMG packaging, and automated Apple Notarization & ticket stapling
      # Previous implementation:
      # - name: Build macOS application
      #   run: flutter build macos --release
      # 
      # - name: Package macOS artifacts
      #   run: |
      #     mkdir -p release_artifacts
      #     
      #     # 1. Package as zip preserving bundle symlinks and permissions
      #     ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/batterie.app release_artifacts/batterie-macos.zip
      #     
      #     # 2. Package as drag-and-drop installer DMG
      #     mkdir -p dmg_root
      #     cp -R build/macos/Build/Products/Release/batterie.app dmg_root/
      #     ln -s /Applications dmg_root/Applications
      #     hdiutil create -volname "Batterie" -srcfolder dmg_root -ov -format UDZO release_artifacts/batterie-macos.dmg
      #     rm -rf dmg_root
      # 
      # - name: Upload macOS artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: macos-artifacts
      #     path: release_artifacts/*
      #     if-no-files-found: error

      - name: Import Apple Developer Certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "::warning ::MACOS_CERTIFICATE_BASE64 secret not set. Skipping certificate import and codesigning."
            exit 0
          fi
          
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application:" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -n "$IDENTITY" ]; then
            echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
            echo "Loaded signing identity: $IDENTITY"
          else
            echo "::warning ::Developer ID Application identity not found in imported certificate."
          fi

      - name: Build macOS application
        run: flutter build macos --release

      - name: Code sign application bundle
        run: |
          APP_PATH="build/macos/Build/Products/Release/batterie.app"
          ENTITLEMENTS="macos/Runner/Release.entitlements"
          
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No signing identity available; leaving ad-hoc signature."
            exit 0
          fi
          
          echo "==> Signing nested frameworks with Hardened Runtime..."
          if [ -d "${APP_PATH}/Contents/Frameworks" ]; then
            find "${APP_PATH}/Contents/Frameworks" -type d -name "*.framework" | while read -r framework; do
              echo "    Signing ${framework}..."
              codesign --force --verbose --options runtime --timestamp --sign "${SIGNING_IDENTITY}" "${framework}"
            done
          fi
          
          echo "==> Signing main application bundle..."
          codesign --force --verbose --options runtime --timestamp --entitlements "${ENTITLEMENTS}" --sign "${SIGNING_IDENTITY}" "${APP_PATH}"
          
          echo "==> Verifying signature integrity..."
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

      - name: Package macOS artifacts
        run: |
          mkdir -p release_artifacts
          APP_PATH="build/macos/Build/Products/Release/batterie.app"
          
          # 1. Package as zip preserving bundle symlinks and permissions
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" release_artifacts/batterie-macos.zip
          
          # 2. Package as drag-and-drop installer DMG
          mkdir -p dmg_root
          cp -R "${APP_PATH}" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Batterie" -srcfolder dmg_root -ov -format UDZO release_artifacts/batterie-macos.dmg
          rm -rf dmg_root
          
          # 3. Sign DMG if identity exists
          if [ -n "$SIGNING_IDENTITY" ]; then
            echo "==> Code signing DMG..."
            codesign --force --sign "${SIGNING_IDENTITY}" --timestamp release_artifacts/batterie-macos.dmg
          fi

      - name: Notarize and staple macOS artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'T7LB768N2Z' }}
        run: |
          DMG_PATH="release_artifacts/batterie-macos.dmg"
          APP_PATH="build/macos/Build/Products/Release/batterie.app"
          
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "::warning ::APPLE_ID or APPLE_APP_SPECIFIC_PASSWORD secret not set. Skipping Apple notarization."
            exit 0
          fi
          
          echo "==> Submitting DMG to Apple Notary Service..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          
          echo "==> Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler staple "$APP_PATH"
          
          # Re-package zip with stapled app bundle so zip also has notarization ticket
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" release_artifacts/batterie-macos.zip
          
          echo "==> Validating DMG ticket..."
          xcrun stapler validate "$DMG_PATH"
          echo "==> Successfully notarized and stapled!"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: release_artifacts/*
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Windows application
        run: flutter build windows --release

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_artifacts
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "release_artifacts\batterie-windows-x64.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release_artifacts/*
          if-no-files-found: error

      # Gene - Oct, 09, 2026: Build Microsoft Store MSIX package (unsigned; Microsoft signs it on Store ingestion).
      # Uploaded as a separate workflow artifact for manual submission in Partner Center, not attached to the GitHub Release.
      - name: Build Microsoft Store MSIX package
        run: dart run msix:create --store --build-windows false

      - name: Upload Microsoft Store MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-store-msix
          path: build/windows/x64/runner/Release/*.msix
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release_assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release_assets

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release_assets/batterie-macos.dmg
            release_assets/batterie-macos.zip
            release_assets/batterie-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
